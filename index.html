<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>干货阅读</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1d2129;--line:#272c36;--fg:#e8eaee;--dim:#9aa3b2;--dim2:#788291;--ok:#4ade80;--accent:#7dd3fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.85 -apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","PingFang SC","Noto Sans SC",sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(5px + env(safe-area-inset-top)) 12px 5px}
.header-inner{max-width:760px;margin:auto}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.grow{flex:1}
.title{font-size:14px;font-weight:600}
select,button,input,summary{font:inherit;color:var(--fg)}
select,button{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
button:active{background:#28303d}
button.primary{background:#1d4ed8;border-color:#2563eb;font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:wait}
button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:2px}
.tabs button{border-color:transparent;background:transparent;padding:5px 8px}
.tabs button[aria-pressed="true"]{color:var(--accent);background:var(--card2)}
.filters{margin-top:3px;gap:4px}
.filters select{padding:4px;font-size:12px;max-width:96px}
.badge{font-size:11px;color:var(--dim);white-space:nowrap}
.badge.dirty{color:#fbbf24}
.badge.ok{color:var(--ok)}
.more{position:relative;font-size:13px}
.more summary{cursor:pointer;list-style:none;padding:6px 8px;border-radius:9px}
.more summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:100%;width:min(290px,90vw);padding:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px #0008}
.menu button{display:block;width:100%;margin:6px 0;text-align:left;padding:10px}
.sub,.hint{font-size:12px;color:var(--dim);line-height:1.6}
#notice,#shell-notice{padding:8px 16px 0;max-width:760px;margin:auto;color:#fbbf24;font-size:12px;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:8px 12px}
.person{margin:22px 4px 8px;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:10px}
.person:after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 18px;margin:12px 0;overflow-wrap:anywhere}
.card p{margin:0 0 16px;white-space:pre-wrap;word-break:break-word}
.card .quote{color:var(--dim);border-left:2px solid var(--line);padding-left:12px;margin:16px 0;white-space:pre-wrap}
.card blockquote{margin:16px 0;padding:12px;background:var(--card2);border-radius:8px;color:var(--dim);white-space:pre-wrap}
.card .cmts{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
.card .cmts div{color:var(--dim);margin:10px 0;white-space:pre-wrap}
.card .cmts b{color:var(--fg);font-weight:600}
.card footer{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.card .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.card .actions button{padding:8px 10px}
.card .favorite[aria-pressed="true"]{color:#fbbf24}
.card .danger{color:#fca5a5}
.sentinel{height:2px;margin-top:10px;pointer-events:none}
.login{max-width:520px;margin:auto;padding:24px 8px}
.login h1{font-size:20px;margin:6px 0}
.login label{display:block;margin:16px 0 6px;font-size:13px;color:var(--dim)}
.login input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:#111827;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;line-height:1.6;z-index:50;opacity:0;pointer-events:none;transition:.2s;width:max-content;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.empty{color:var(--dim);text-align:center;padding:60px 20px;font-size:16px}
@media(max-width:360px){.title{display:none}.card{padding:18px 14px}.tabs button{padding:5px 6px}}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="header-inner">
    <div class="row">
      <span class="title">阅读</span>
      <select id="dates" aria-label="阅读日期"></select>
      <span class="grow"></span>
      <button class="ghost" id="refresh" aria-label="刷新当前日期">刷新</button>
      <details class="more" id="more">
        <summary aria-label="更多操作">更多</summary>
        <div class="menu">
          <div id="stat" class="sub"></div>
          <div id="build-version" class="sub"></div>
          <button id="update-shell" hidden>刷新到新版</button>
          <button id="save-reading">同步阅读状态</button>
          <button class="primary" id="save">确认并保存决策</button>
          <button id="queue">投递清洗</button>
          <button id="fullscreen">全屏阅读</button>
          <div class="hint">收藏只是标记，不等于归档。投递仍受桌面影子模式保护。</div>
        </div>
      </details>
    </div>
    <div class="row filters">
      <nav class="tabs" aria-label="阅读视图">
        <button data-view="good" aria-pressed="true">干货</button>
        <button data-view="water" aria-pressed="false">水贴</button>
        <button data-view="favorites" aria-pressed="false">收藏</button>
      </nav>
      <span class="grow"></span>
      <select id="read-filter" aria-label="已读过滤">
        <option value="all">默认（全部）</option><option value="read">已读</option><option value="unread">未读</option>
      </select>
      <span id="state" class="badge" aria-live="polite">加载中</span>
    </div>
  </div>
</header>
<div id="notice" role="status" hidden></div>
<div id="shell-notice" role="status" hidden><span id="shell-message"></span> <button id="login-update-shell" hidden>刷新到新版</button></div>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* 无后端、无依赖的私有仓阅读器。公开发布与 SW 仅含空壳；业务数据只存本机和私有仓。 */
const BUILD_VERSION = 'eba65a52ee91be4c';
const validBuildVersion = v => typeof v === 'string' && v.length === 16 && /^[0-9a-f]{16}$/.test(v);
const CURRENT_VERSION = validBuildVersion(BUILD_VERSION) ? BUILD_VERSION : 'dev';
const PROVIDERS = {
  gitee: { label: 'Gitee 私有仓', base: 'https://gitee.com/api/v5', repo: 'davidsheh/spider',
    hint: 'Gitee 私人令牌（勾 projects）。它是账号级权限，等于该账号所有仓可读写。' },
  github: { label: 'GitHub 私有仓（推荐）', base: 'https://api.github.com', repo: 'davidsheh/spider-mobile',
    hint: 'GitHub fine-grained PAT：只授权这一个仓、只 Contents 读写。Gitee 令牌永不上手机。' },
};
const LS = { cfg: 'spider.cfg', auth: 'spider.auth' };
const $ = s => document.querySelector(s);
const emptyReading = () => ({ version: 1, items: {} });
const emptyStore = () => ({ dates: [], lastDate: '', days: {}, reading: emptyReading(), readingDirty: false });
const S = {
  cfg: { owner: 'davidsheh', repo: 'spider', branch: '', provider: 'gitee' }, token: '', pin: null,
  dates: [], date: '', feed: null, keep: new Map(), pending: {}, reading: emptyReading(),
  store: emptyStore(), readingDirty: false, dirty: false, busy: false, offline: false,
  view: 'good', readFilter: 'all', heldRead: new Set(), storageError: false,
};

/* ---------------------------------------------------------------- 基础工具 / 本机隔离持久化 */
function toast(msg, ms = 2600) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function safeUrl(s) { return /^https?:\/\//i.test(s || '') ? esc(s) : '#'; }
function b64enc(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const scopeKey = () => 'spider.reader.v1.' + JSON.stringify([S.cfg.provider, S.cfg.owner, S.cfg.repo, S.cfg.branch || '']);
function restoreLocal() {
  S.store = emptyStore();
  try {
    const saved = JSON.parse(localStorage.getItem(scopeKey()) || 'null');
    if (saved) S.store = Object.assign(emptyStore(), saved);
    S.reading = mergeReading(emptyReading(), S.store.reading);
    S.readingDirty = !!S.store.readingDirty;
  } catch (e) { S.reading = emptyReading(); S.readingDirty = false; toast('本机缓存无法读取，未使用损坏数据', 5000); }
  S.date = ''; S.feed = null; S.keep = new Map(); S.pending = {}; S.dirty = false;
}
function persistLocal() {
  if (unsafeHttp()) return false; // 不安全启动未恢复 store，不能在 pagehide 时用空值覆盖旧 HTTP 草稿。
  if (S.date) {
    const day = S.store.days[S.date] || { picks: '' };
    day.feed = S.feed; day.pending = Object.assign({}, S.pending);
    S.store.days[S.date] = day; S.store.lastDate = S.date;
  }
  S.store.dates = S.dates; S.store.reading = S.reading; S.store.readingDirty = S.readingDirty;
  try { localStorage.setItem(scopeKey(), JSON.stringify(S.store)); S.storageError = false; return true; }
  catch (e) { S.storageError = true; toast('本机存储失败：刷新可能丢失改动，请先联网保存或释放浏览器空间', 6000); return false; }
}
function preserveDraft() {
  if (persistLocal() && (S.dirty || S.readingDirty)) toast('未同步改动已保存在本机，切换或刷新不会丢失；决策仍待明确确认', 5000);
}

/* ---------------------------------------------------------------- 空壳版本：无凭据检查，只能显式刷新；不触碰业务同步 */
const U = { available: '', checking: null, registering: null, registration: null, updating: null, refreshing: false, swProblem: '' };
function unsafeHttp() {
  return location.protocol === 'http:' && !['localhost', '127.0.0.1', '[::1]', '::1'].includes(location.hostname);
}
function canonicalShellURL() {
  if (CURRENT_VERSION === 'dev' || !window.history?.replaceState) return;
  const url = new URL(location.href);
  if (url.searchParams.get('spider_version') !== CURRENT_VERSION) return;
  url.searchParams.delete('spider_version');
  window.history.replaceState(null, '', url.href); // 完成新版加载后恢复离线可缓存 URL，保留其他参数和 hash。
}
function showHTTPSWarning() {
  S.token = ''; stopObserving(); $('#hdr').hidden = true; $('#notice').hidden = true;
  $('#main').innerHTML = '<div class="login"><h1>请使用 HTTPS</h1><div class="hint">当前 HTTP 连接不安全，已禁止填写或加载 PAT。请改用此站点的 HTTPS 地址；本机 localhost 调试和直接打开 file 文件仍可使用。</div></div>';
  renderBuildStatus();
}
function renderBuildStatus() {
  $('#build-version').textContent = '当前版本：' + (CURRENT_VERSION === 'dev' ? '开发版' : CURRENT_VERSION);
  $('#update-shell').hidden = !U.available;
  $('#update-shell').textContent = '刷新到新版 ' + U.available;
  const message = [U.available ? '发现新版 ' + U.available + '；仅点击「刷新到新版」才会更新页面，请先确认保存所有日期的草稿并同步阅读状态。' : '', U.swProblem].filter(Boolean).join(' ');
  $('#shell-message').textContent = message; $('#shell-notice').hidden = !message;
  $('#login-update-shell').hidden = !U.available || !$('#hdr').hidden;
}
async function checkRelease() {
  if (U.checking) return U.checking;
  if (location.protocol === 'file:' || unsafeHttp()) return;
  U.checking = (async () => {
    let timer;
    try {
      const abort = new AbortController(); timer = setTimeout(() => abort.abort(), 8000);
      // 独立于 apiGet/apiHeaders：业务 PAT 与发布 PAT 都不参与此相对静态 GET。
      const r = await fetch('release.json', { method: 'GET', cache: 'no-store', credentials: 'omit', mode: 'same-origin', redirect: 'error', signal: abort.signal });
      if (!r.ok) return;
      const release = await r.json();
      if (!validBuildVersion(release?.version)) return;
      U.available = release.version !== CURRENT_VERSION ? release.version : '';
      renderBuildStatus();
    } catch (e) { /* 离线 / 缺少发布清单静默，不影响阅读与登录。 */ }
    finally { clearTimeout(timer); }
  })();
  try { await U.checking; } finally { U.checking = null; }
}
function swFailure() {
  U.swProblem = '空壳更新检查失败；页面不会自动刷新，请联网后重试（浏览器也可能不支持离线空壳）。';
  renderBuildStatus();
}
async function shellTimeout(task, ms = 12000) {
  let timer;
  try { return await Promise.race([task, new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('空壳更新超时，请联网后重试')), ms); })]); }
  finally { clearTimeout(timer); }
}
async function ensureShellWorker(update = false) {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:' || unsafeHttp()) return null;
  try {
    if (!U.registering) U.registering = navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
    const reg = await shellTimeout(U.registering);
    if (U.registration !== reg) {
      U.registration = reg;
      reg.addEventListener('updatefound', () => {
        const worker = reg.installing;
        if (worker) worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' || worker.state === 'activated') {
            U.swProblem = '空壳更新已就绪；不会自动刷新，请检查新版后手动更新。';
            renderBuildStatus(); void checkRelease();
          }
        });
      });
    }
    if (update) {
      if (!U.updating) U.updating = reg.update();
      const updating = U.updating;
      try { await shellTimeout(updating); } finally { if (U.updating === updating) U.updating = null; }
    }
    U.swProblem = ''; renderBuildStatus(); return reg;
  } catch (e) {
    if (!U.registration) U.registering = null; // 注册失败允许用户稍后重试。
    swFailure(); return null;
  }
}
function waitForVersionWorker(reg, version) {
  // 旧 SW（包括 v2）忽略 query，不能仅凭 update() 已返回就 reload。
  // 必须由已接管本页的 activated SW 回报目标版本；超时宁可拒绝刷新。
  return new Promise((resolve, reject) => {
    const sw = navigator.serviceWorker, watched = new Set(), asked = new Set(), channels = new Set();
    let done = false;
    const finish = error => {
      if (done) return; done = true; clearTimeout(timer);
      sw.removeEventListener('controllerchange', inspect); reg.removeEventListener('updatefound', inspect);
      for (const worker of watched) worker.removeEventListener('statechange', inspect);
      for (const channel of channels) { channel.port1.close(); channel.port2.close(); }
      error ? reject(error) : resolve();
    };
    const inspect = () => {
      for (const worker of [reg.installing, reg.waiting, reg.active]) if (worker && !watched.has(worker)) {
        watched.add(worker); worker.addEventListener('statechange', inspect);
      }
      const worker = sw.controller;
      if (!worker || worker.state !== 'activated' || asked.has(worker)) return;
      asked.add(worker);
      const channel = new MessageChannel(); channels.add(channel);
      channel.port1.onmessage = e => {
        if (e.data?.type === 'SPIDER_BUILD_VERSION' && e.data.version === version && sw.controller === worker && worker.state === 'activated') finish();
      };
      try { worker.postMessage({ type: 'SPIDER_GET_BUILD_VERSION' }, [channel.port2]); }
      catch (e) { finish(new Error('无法确认新空壳已接管页面')); }
    };
    const timer = setTimeout(() => finish(new Error('新版空壳尚未激活，请联网后稍候再试')), 12000);
    sw.addEventListener('controllerchange', inspect); reg.addEventListener('updatefound', inspect); inspect();
  });
}
function refreshBlocked() {
  if (S.busy) { toast('正在处理，请稍后刷新新版'); return true; }
  const pending = Object.keys(S.pending).length || Object.values(S.store.days).some(day => Object.keys(day.pending || {}).length);
  if (S.dirty || S.readingDirty || S.storageError || pending) {
    toast('请先确认保存所有日期的决策草稿、同步阅读状态，并解决本机存储错误，再刷新新版', 6500); return true;
  }
  return false;
}
async function refreshToNewVersion() {
  if (U.refreshing || !validBuildVersion(U.available) || refreshBlocked()) return;
  if (!persistLocal()) return; // 即便没有 dirty，最后一次本机持久化失败也不能刷新。
  U.refreshing = true; const version = U.available;
  try {
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      const reg = await ensureShellWorker(true);
      if (!reg) throw new Error('无法更新空壳，请联网后重试');
      await waitForVersionWorker(reg, version);
    }
    const url = new URL('index.html', location.href);
    url.searchParams.set('spider_version', version);
    // 新 SW 对带版本的白名单 URL 仅走网络，不回退旧 cache；预检也防止部署尚未完成。
    await shellTimeout((async () => {
      const r = await fetch(url.href, { cache: 'no-store', credentials: 'omit', mode: 'same-origin', redirect: 'error' });
      if (!r.ok || !(await r.text()).includes("const BUILD_VERSION = '" + version + "';")) throw new Error('新版页面尚未就绪，请稍后再试');
    })());
    // SW 激活 / 网络等待期间仍可有新已读或操作，必须在离开前再次检查。
    if (refreshBlocked() || !persistLocal()) return;
    location.assign(url.href); // 仅由按钮的显式调用触发，绝不在版本检测或 controllerchange 中刷新。
  } catch (e) { toast('未刷新：' + e.message, 6500); }
  finally { U.refreshing = false; }
}

/* ---------------------------------------------------------------- API：每次重试都重新读取，并重新 build */
function provider() { return PROVIDERS[S.cfg.provider] || PROVIDERS.gitee; }
function apiUrl(p) {
  const qs = [];
  if (S.cfg.provider === 'gitee') qs.push('access_token=' + encodeURIComponent(S.token));
  if (S.cfg.branch) qs.push('ref=' + encodeURIComponent(S.cfg.branch));
  return `${provider().base}/repos/${S.cfg.owner}/${S.cfg.repo}/contents/${encodeURI(p)}` + (qs.length ? '?' + qs.join('&') : '');
}
function apiHeaders() {
  return S.cfg.provider === 'gitee' ? {} : { Authorization: 'Bearer ' + S.token, Accept: 'application/vnd.github+json' };
}
async function apiGet(path) {
  const r = await fetch(apiUrl(path), { cache: 'no-store', headers: apiHeaders() });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`读取失败 ${r.status} ${path}`);
  return r.json();
}
// Gitee 的 contents 接口对不存在的路径返回 200 + []（不是 404），目录也是数组。
// 若把 [] 当文件读，content 就是 undefined，atob('undefined') 会抛
// "The string to be decoded is not correctly encoded"，并且新增文件再也写不出去。
function fileEntry(j, path) {
  if (j == null || Array.isArray(j)) return null; // 缺失（Gitee 的 []）或目录列表，都不是文件。
  if (typeof j !== 'object') throw new Error(`${path} 返回的不是文件对象`);
  if (j.type && j.type !== 'file') throw new Error(`${path} 不是普通文件（${j.type}）`);
  return j;
}
function fileText(j, path) {
  const entry = fileEntry(j, path);
  if (!entry) return null;
  if (typeof entry.content !== 'string') throw new Error(`${path} 缺少 content，无法解码（可能超过接口大小限制）`);
  if (entry.encoding && entry.encoding !== 'base64') throw new Error(`${path} 的编码不是 base64（${entry.encoding}）`);
  return b64dec(entry.content);
}
async function apiPut(path, text, message, sha) {
  const body = { content: b64enc(text), message };
  if (sha) body.sha = sha;
  if (S.cfg.branch) body.branch = S.cfg.branch;
  if (S.cfg.provider === 'gitee') body.access_token = S.token;
  const send = method => fetch(apiUrl(path), { method, headers: Object.assign({ 'Content-Type': 'application/json' }, apiHeaders()), body: JSON.stringify(body) });
  // Gitee 新建文件是 POST /contents/{path}，PUT 只用于更新（需 sha）；GitHub 一律 PUT。
  const create = !sha && S.cfg.provider === 'gitee';
  let r = await send(create ? 'POST' : 'PUT');
  if (create && (r.status === 404 || r.status === 405)) r = await send('PUT'); // 没有 POST 路由时退回 PUT。
  if (r.ok) return r.json();
  if (r.status === 409 || r.status === 422) return { conflict: true };
  throw new Error(`写入失败 ${r.status}`);
}
async function putWithRetry(path, build, message) {
  for (let i = 0; i < 2; i++) {
    const cur = fileEntry(await apiGet(path), path);

/* ---------------------------------------------------------------- 渲染：正文始终展开，操作只在帖尾 */

/* ---------------------------------------------------------------- 加载：feed、picks、待确认选择与全局状态按仓库隔离 */

/* ---------------------------------------------------------------- 保存：阅读状态不确认 picks，只有显式按钮确认 */

  if (!confirm('投递已确认保存的干货到清洗队列？桌面仍受原有影子模式保护，投递不等于完成归档。')) return;

    const selected = allItems().filter(it => bucketOf(it) === 'good' && S.keep.get(it.id) === true);
    let added = 0;
    await putWithRetry('data/state/clean_queue.json', remote => {

}
async function saveAuth(token, pin) {
  if (unsafeHttp()) throw new Error('请使用 HTTPS，HTTP 下禁止保存 PAT');
  if (!pin) { localStorage.setItem(LS.auth, JSON.stringify({ mode: 'plain', token })); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pin, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(token));
  const raw64 = bytes => btoa(String.fromCharCode(...bytes));
  localStorage.setItem(LS.auth, JSON.stringify({ mode: 'pin', encoding: 'raw', salt: raw64(salt), iv: raw64(iv), ct: raw64(new Uint8Array(ct)) }));
}
async function loadAuthWithPin(pin) {
  if (unsafeHttp()) throw new Error('请使用 HTTPS，HTTP 下禁止加载 PAT');
  const a = storedAuth(); if (!a || a.mode !== 'pin') throw new Error('没有加密的令牌');
  // 兼容旧版经 UTF-8 再 base64 的二进制凭据，新版直接编码原始字节。
  const u8 = s => Uint8Array.from(a.encoding === 'raw' ? atob(s) : b64dec(s), c => c.charCodeAt(0));
  const key = await deriveKey(pin, u8(a.salt));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(a.iv) }, key, u8(a.ct));
  return new TextDecoder().decode(pt);
}
function storedAuth() { if (unsafeHttp()) return null; try { return JSON.parse(localStorage.getItem(LS.auth) || 'null'); } catch (e) { return null; } }
function showLogin(msg) {
  if (unsafeHttp()) return showHTTPSWarning();
  stopObserving(); $('#hdr').hidden = true; $('#notice').hidden = true; renderBuildStatus();
  $('#main').innerHTML = `<div class="login">
    <h1>干货阅读</h1><div class="hint">用你的令牌读取私有仓，凭据只存在本机。</div>
    ${msg ? `<div class="hint">${esc(msg)}</div>` : ''}
    <label for="f-provider">数据源</label><select id="f-provider" style="width:100%">${Object.entries(PROVIDERS).map(([k, v]) => `<option value="${k}"${S.cfg.provider === k ? ' selected' : ''}>${esc(v.label)}</option>`).join('')}</select>
    <div class="hint" id="f-hint">${esc(provider().hint)}</div>
    <label for="f-repo">仓库（owner/repo）</label><input id="f-repo" value="${esc(S.cfg.owner + '/' + S.cfg.repo)}" autocapitalize="off" autocorrect="off">
    <label for="f-branch">分支（留空用默认分支）</label><input id="f-branch" value="${esc(S.cfg.branch)}" autocapitalize="off" autocorrect="off">
    <label for="f-token">令牌</label><input id="f-token" type="password" placeholder="粘贴令牌" autocapitalize="off" autocorrect="off">
    <label for="f-pin">PIN（可选：加密保存令牌）</label><input id="f-pin" type="password" inputmode="numeric" placeholder="留空 = 明文保存在本机">
    <button class="primary" id="f-go" style="width:100%;margin-top:22px">进入</button>
    <div class="hint" style="margin-top:18px">PIN 只加密凭据，不加密本机正文与阅读缓存。Gitee 令牌泄露影响整个账号；GitHub fine-grained 仅影响授权仓。</div>
  </div>`;
  $('#f-provider').onchange = () => { const pv = PROVIDERS[$('#f-provider').value]; $('#f-hint').textContent = pv.hint; $('#f-repo').value = pv.repo; };
  $('#f-go').onclick = async () => {
    const [o, r, extra] = ($('#f-repo').value || '').trim().split('/');
    if (!o || !r || extra) return toast('仓库格式：owner/repo');
    const token = $('#f-token').value.trim(); if (!token) return toast('先填令牌');
    const cfg = { owner: o.trim(), repo: r.trim(), branch: $('#f-branch').value.trim(), provider: $('#f-provider').value };
    try {
      await saveAuth(token, $('#f-pin').value.trim());
      S.cfg = cfg; S.token = token; localStorage.setItem(LS.cfg, JSON.stringify(S.cfg)); boot();
    } catch (e) { toast('凭据保存失败：' + e.message, 5000); }
  };
}
async function promptPin() {
  if (unsafeHttp()) return showHTTPSWarning();
  $('#hdr').hidden = true; renderBuildStatus();
  $('#main').innerHTML = `<div class="login"><h1>输入 PIN</h1><div class="hint">令牌已加密保存在本机。</div>
    <label for="f-pin">PIN</label><input id="f-pin" type="password" inputmode="numeric" autofocus>
    <button class="primary" id="f-go" style="width:100%;margin-top:22px">解锁</button>
    <div class="hint" style="margin-top:18px"><a href="#" id="f-reset">忘记 PIN / 换令牌</a></div></div>`;
  const go = async () => {
    try { S.token = await loadAuthWithPin($('#f-pin').value.trim()); }
    catch (e) { return toast('PIN 不对'); }
    boot();
  };
  $('#f-go').onclick = go;
  $('#f-pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#f-reset').onclick = e => { e.preventDefault(); localStorage.removeItem(LS.auth); location.reload(); };
}
async function boot() {
  if (unsafeHttp()) return showHTTPSWarning();
  restoreLocal(); $('#hdr').hidden = false; renderBuildStatus();
  try {
    await loadDates();
    if (!S.dates.length) { updateStatus(); $('#main').innerHTML = '<div class="empty">还没有 daily/ 或本机离线缓存</div>'; return; }
    await loadDay(S.dates.includes(S.store.lastDate) ? S.store.lastDate : S.dates[0]);
  } catch (e) { showLogin('未能读取仓库：' + e.message + '。本机缓存没有删除。'); }
}

/* ---------------------------------------------------------------- 事件 / 启动 */
$('#dates').onchange = e => {
  if (S.busy) { e.target.value = S.date; return toast('正在处理，请稍后切日期'); }
  preserveDraft(); loadDay(e.target.value);
};
$('#refresh').onclick = () => { void checkRelease(); void ensureShellWorker(true); if (S.busy) return toast('正在处理'); preserveDraft(); loadDay(S.date); };
$('#update-shell').onclick = refreshToNewVersion;
$('#login-update-shell').onclick = refreshToNewVersion;
$('#save').onclick = save;
$('#save-reading').onclick = syncReading;
$('#queue').onclick = deliver;
$('#fullscreen').onclick = fullscreen; // 必须由点击触发，绝不在开页时请求。
for (const b of document.querySelectorAll('[data-view]')) b.onclick = () => { S.view = b.dataset.view; S.heldRead.clear(); render(); };
$('#read-filter').onchange = e => { S.readFilter = e.target.value; S.heldRead.clear(); render(); };
$('#main').addEventListener('click', e => {
  const b = e.target.closest('button[data-action]'); if (!b) return;
  const id = b.closest('.card').dataset.id, action = b.dataset.action;
  const it = allItems().find(it => it.id === id); if (!it || bucketOf(it) === 'destroyed') return;
  if (S.busy && action !== 'read') return toast('正在同步，请稍后操作');
  if (action === 'read') { markRead(id, !isRead(id)); return; }
  if (action === 'favorite' && bucketOf(it) === 'good') changeReading(id, 'favorite', !readingItem(id).favorite);
  if (action === 'bucket') changeReading(id, 'bucket', bucketOf(it) === 'water' ? 'good' : 'water');
  if (action === 'destroy') {
    if (!confirm('永久销毁这条水贴？同步后在所有日期和收藏中永不展示，不能恢复；原始业务文件不会删除。')) return;
    changeReading(id, 'bucket', 'destroyed');
  }
  render();
});
window.addEventListener('pagehide', persistLocal);
window.addEventListener('beforeunload', e => {
  persistLocal();
  if (S.dirty || S.readingDirty || S.storageError) { e.preventDefault(); e.returnValue = ''; }
});
renderBuildStatus();
(async function start() {
  if (unsafeHttp()) return showHTTPSWarning(); // 在任何配置 / 凭据读取之前拦截不安全启动。
  canonicalShellURL();
  void checkRelease(); void ensureShellWorker();
  try { Object.assign(S.cfg, JSON.parse(localStorage.getItem(LS.cfg) || '{}')); } catch (e) { }
  // 登录 / PIN 解锁前也能刷新空壳，先恢复当前仓的草稿，避免空 store 覆盖已有草稿。
  restoreLocal(); S.dates = S.store.dates || [];
  const a = storedAuth(); if (!a) return showLogin();
  if (a.mode === 'pin') return promptPin();
  S.token = a.token; boot();
})();
</script>
