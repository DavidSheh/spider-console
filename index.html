<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>干货阅读</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* 手机阅读版式对齐雪球 App：全宽信息流行、作者头行、正文 18px/1.66、评论 15px、底部四键操作栏。 */
:root{--bg:#0f1115;--card:#15171d;--card2:#1d2129;--chip:#1f232c;--line:#24272f;--line2:#2c313b;--fg:#e9ebef;--dim:#9aa3b2;--dim2:#78828f;--ok:#4ade80;--accent:#7dd3fc;--star:#fbbf24;--danger:#fca5a5;--fs-body:18px;--fs-cmt:15px;--fs-meta:12.5px;--pad:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding-bottom:calc(36px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
svg{display:block}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) var(--pad) 6px}
.header-inner{max-width:760px;margin:auto}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
select,button,input,summary{font:inherit;color:var(--fg)}
select,button{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
button:active{background:#28303d}
button.primary{background:#1d4ed8;border-color:#2563eb;font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:wait}
button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:18px;min-width:0;overflow:hidden}
.tabs button{position:relative;background:transparent;border:0;border-radius:0;padding:5px 0;line-height:1.3;font-size:16px;color:var(--dim);white-space:nowrap}
.tabs button[aria-pressed="true"]{color:var(--fg);font-weight:600;background:transparent}
.tabs button[aria-pressed="true"]:after{content:"";position:absolute;left:50%;margin-left:-9px;bottom:1px;width:18px;height:2.5px;border-radius:2px;background:var(--fg)}
.badge{font-size:11px;color:var(--dim);white-space:nowrap}
.badge.dirty{color:#fbbf24}
.badge.ok{color:var(--ok)}
#save{padding:5px 10px;white-space:nowrap}
.more{position:relative;font-size:13px}
.more summary{cursor:pointer;list-style:none;width:32px;height:30px;display:grid;place-items:center;color:var(--dim);border-radius:8px}
.more summary::-webkit-details-marker{display:none}
.more summary svg{width:20px;height:20px}
.more[open] summary{color:var(--fg);background:var(--card2)}
.menu{position:absolute;right:0;top:100%;width:min(290px,88vw);padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px #000a}
.menu button{display:block;width:100%;margin:6px 0;text-align:left;padding:10px}
.menu select{display:block;width:100%;margin:6px 0;padding:10px;font-size:14px}
.sub,.hint{font-size:12px;color:var(--dim);line-height:1.6}
#notice,#shell-notice{padding:8px var(--pad) 0;max-width:760px;margin:auto;color:#fbbf24;font-size:12px;line-height:1.6}
main{max-width:760px;margin:0 auto}
.person{padding:10px var(--pad);font-size:12px;color:var(--dim2);background:#0c0e12;border-bottom:1px solid var(--line);letter-spacing:.02em}
.card{background:var(--card);padding:14px var(--pad) 2px;border-bottom:1px solid var(--line)}
.card .head{display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:10px}
.avatar{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:12.5px;font-weight:600;color:#fff;background:#2b3240;overflow:hidden}
.card .head .name{font-size:14px;font-weight:500;color:#d3dae6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.card .head .meta{flex:1;min-width:0;font-size:var(--fs-meta);color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plat{display:inline-block;margin-right:5px;padding:1px 5px;border-radius:4px;background:var(--chip);color:var(--dim);font-size:10.5px;vertical-align:1px}
.read-label{flex:none;font-size:11px;color:var(--dim2)}
.read-label:before{content:"·";margin-right:3px}
.card .body{font-size:var(--fs-body);line-height:1.66;color:#e6e9ef;overflow-wrap:anywhere}
.card .body p{margin:0 0 14px;white-space:pre-wrap;word-break:break-word}
.card .body p:last-child{margin-bottom:2px}
.card .quote{color:var(--dim);border-left:2px solid var(--line2);padding-left:12px;margin:14px 0;font-size:16px;line-height:1.6;white-space:pre-wrap}
.card blockquote{margin:14px 0;padding:12px;background:var(--card2);border-radius:10px;color:var(--dim);font-size:15px;line-height:1.6;white-space:pre-wrap}
.card .actions{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-top:6px;padding:2px 0 6px}
.card .actions .act{display:inline-flex;align-items:center;gap:6px;min-height:40px;background:transparent;border:0;border-radius:8px;padding:9px 8px;font-size:13.5px;color:var(--dim)}
.card .actions .act svg{width:19px;height:19px;pointer-events:none}
.card .actions .act:active{background:#1e222a;color:var(--fg)}
.card .actions .act[aria-pressed="true"]{color:var(--star)}
.card .actions .act[aria-pressed="true"] svg{fill:currentColor}
.card .actions .count{font-size:12.5px;color:var(--dim2)}
.card .actions .act[aria-pressed="true"] .count{color:inherit}
.card .actions .more-btn{margin-left:auto;padding:9px 6px}
.detail-bar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px var(--pad);background:rgba(15,17,21,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.detail-bar .back{display:grid;place-items:center;background:transparent;border:0;border-radius:8px;padding:2px 4px;color:var(--fg)}
.detail-bar .back svg{width:24px;height:24px}
.detail-bar .avatar{width:26px;height:26px;font-size:12px}
.detail-bar .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-bar .act{display:grid;place-items:center;background:transparent;border:0;border-radius:8px;padding:6px;color:var(--dim)}
.detail-bar .act svg{width:20px;height:20px}
.card.detail .head{margin-bottom:8px}
.cmts{background:var(--card);border-bottom:1px solid var(--line);padding:0 var(--pad) 18px}
.cmts-head{display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.cmt{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.cmt:last-child{border-bottom:0;padding-bottom:2px}
.cmt .avatar{width:26px;height:26px;font-size:12px;margin-top:2px}
.cmt .cmt-body{flex:1;min-width:0}
.cmt .cmt-name{font-size:13px;color:var(--dim);margin-bottom:4px}
.cmt .cmt-text{font-size:var(--fs-cmt);line-height:1.62;color:#dfe4ec;white-space:pre-wrap;overflow-wrap:anywhere}
.author-entry{display:block;width:100%;text-align:left;background:var(--card);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px var(--pad);font-size:16px}
.author-entry small{display:block;margin-top:4px;color:var(--dim);font-size:12px}
.load-tail{text-align:center;padding:22px 8px;color:var(--dim);font-size:13px}
.load-tail button{margin:6px}
.favorite-heading{display:flex;gap:12px;align-items:center;padding:12px var(--pad);border-bottom:1px solid var(--line)}
#dates{max-width:145px}
.sentinel{height:2px;margin-top:10px;pointer-events:none}
.login{max-width:520px;margin:auto;padding:24px 16px}
.login h1{font-size:20px;margin:6px 0}
.login label{display:block;margin:16px 0 6px;font-size:13px;color:var(--dim)}
.login input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:#111827;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;line-height:1.6;z-index:70;opacity:0;pointer-events:none;transition:.2s;width:max-content;max-width:90vw;text-align:center;overflow-wrap:anywhere;word-break:break-word}
.toast.show{opacity:1;pointer-events:auto}
.toast button{margin-left:10px}
.empty{color:var(--dim);text-align:center;padding:60px 20px;font-size:15px}
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-panel{position:relative;background:#14161c;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;padding:20px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -16px 44px rgba(0,0,0,.6);animation:sheet-in .16s ease-out}
@keyframes sheet-in{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet-items{display:flex;align-items:flex-start;justify-content:space-around;gap:6px}
.sheet-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:0;padding:4px 2px;font-size:13px;color:var(--fg)}
.sheet-item .ico{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--chip);color:#e7eaf0}
.sheet-item .ico svg{width:23px;height:23px}
.sheet-item:active .ico{background:#2a303b}
.sheet-item.danger{color:var(--danger)}
.sheet-item.danger .ico{color:var(--danger)}
.sheet-item[disabled]{opacity:.4}
.sheet-cancel{display:block;width:100%;margin-top:18px;padding:14px;background:var(--chip);border:0;border-radius:12px;font-size:15px;font-weight:600}
@media(min-width:600px){main{padding:0 12px}.card{border:1px solid var(--line);border-radius:14px;margin:14px 0;padding:16px 18px 4px}.cmts{border:1px solid var(--line);border-radius:14px;margin:0 0 14px;padding:0 18px 16px}.detail-bar{margin:0 -12px}.author-entry{border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:14px 16px}}
@media(max-width:360px){.tabs{gap:12px}.tabs button{font-size:15px}#state{display:none}}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="header-inner">
    <div class="row">
      <nav class="tabs" aria-label="阅读视图">
        <button data-view="good" aria-pressed="true">干货</button>
        <button data-view="water" aria-pressed="false">水贴</button>
        <button data-view="favorites" aria-pressed="false">收藏</button>
      </nav>
      <span class="grow"></span>
      <button class="primary" id="save" hidden>保存</button>
      <span id="state" class="badge" aria-live="polite">加载中</span>
      <details class="more" id="more">
        <summary aria-label="更多操作" title="更多操作"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></summary>
        <div class="menu">
          <div id="stat" class="sub"></div>
          <select id="dates" aria-label="跳到某天" title="跳到某天，从这一天向前阅读"></select>
          <select id="read-filter" aria-label="已读过滤">
            <option value="all">已读过滤：全部</option><option value="read">已读过滤：已读</option><option value="unread">已读过滤：未读</option>
          </select>
          <button id="refresh">刷新信息流</button>
          <button id="queue">投递所选日期的清洗</button>
          <div id="build-version" class="sub"></div>
          <button id="update-shell" hidden>刷新到新版</button>
          <button id="fullscreen">全屏阅读</button>
          <div class="hint">收藏只是标记，不等于归档。投递仍受桌面影子模式保护。</div>
        </div>
      </details>
    </div>
  </div>
</header>
<div id="notice" role="status" hidden></div>
<div id="shell-notice" role="status" hidden><span id="shell-message"></span> <button id="login-update-shell" hidden>刷新到新版</button></div>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-mask" id="sheet-mask"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="更多操作">
    <div class="sheet-items" id="sheet-items"></div>
    <button class="sheet-cancel" data-sheet-close="1">取消</button>
  </div>
</div>
<script>
'use strict';
/* 无后端、无依赖的私有仓阅读器。公开发布与 SW 仅含空壳；业务数据只存本机和私有仓。 */
const BUILD_VERSION = '980b030145fbd4ea';
const validBuildVersion = v => typeof v === 'string' && v.length === 16 && /^[0-9a-f]{16}$/.test(v);
const CURRENT_VERSION = validBuildVersion(BUILD_VERSION) ? BUILD_VERSION : 'dev';
const PROVIDERS = {
  gitee: { label: 'Gitee 私有仓', base: 'https://gitee.com/api/v5', repo: 'davidsheh/spider',
    hint: 'Gitee 私人令牌（勾 projects）。它是账号级权限，等于该账号所有仓可读写。' },
  github: { label: 'GitHub 私有仓（推荐）', base: 'https://api.github.com', repo: 'davidsheh/spider-mobile',
    hint: 'GitHub fine-grained PAT：只授权这一个仓、只 Contents 读写。Gitee 令牌永不上手机。' },
};
const LS = { cfg: 'spider.cfg', auth: 'spider.auth' };
const $ = s => document.querySelector(s);
const emptyReading = () => ({ version: 1, items: {} });
const emptyStore = () => ({ dates: [], lastDate: '', days: {}, reading: emptyReading(), readingDirty: false });
const S = {
  cfg: { owner: 'davidsheh', repo: 'spider', branch: '', provider: 'gitee' }, token: '', pin: null,
  dates: [], date: '', feed: null, keep: new Map(), pending: {}, reading: emptyReading(),
  store: emptyStore(), readingDirty: false, dirty: false, busy: false, offline: false,
  view: 'good', readFilter: 'all', heldRead: new Set(), storageError: false,
  loadedDates: [], loading: false, loadError: '', loadPaused: false, scanEmpty: 0,
  favoriteAuthor: '', positions: {}, filters: {}, cancelLoad: false, failedDate: '', undo: null, openId: '', sheetId: '',
};
const INITIAL_ITEMS = 20, SCAN_DAYS = 7;

/* ---------------------------------------------------------------- 基础工具 / 本机隔离持久化 */
function toast(msg, ms = 2600) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function b64enc(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const scopeKey = () => 'spider.reader.v1.' + JSON.stringify([S.cfg.provider, S.cfg.owner, S.cfg.repo, S.cfg.branch || '']);
function restoreLocal() {
  S.store = emptyStore();
  try {
    const saved = JSON.parse(localStorage.getItem(scopeKey()) || 'null');
    if (saved) S.store = Object.assign(emptyStore(), saved);
    S.reading = mergeReading(emptyReading(), S.store.reading);
    S.readingDirty = !!S.store.readingDirty;
  } catch (e) { S.reading = emptyReading(); S.readingDirty = false; toast('本机缓存无法读取，未使用损坏数据', 5000); }
  S.date = ''; S.feed = null; S.keep = new Map(); S.pending = {}; S.dirty = false;
  S.loadedDates = []; S.positions = {}; S.filters = {}; S.favoriteAuthor = ''; S.view = 'good'; S.readFilter = 'all';
  S.loadError = ''; S.failedDate = ''; S.loadPaused = false; S.openId = ''; S.sheetId = '';
}
function persistLocal() {
  if (unsafeHttp()) return false; // 不安全启动未恢复 store，不能在 pagehide 时用空值覆盖旧 HTTP 草稿。
  if (S.date) {
    const day = S.store.days[S.date] || { picks: '' };
    day.feed = S.feed; day.pending = Object.assign({}, S.pending);
    S.store.days[S.date] = day; S.store.lastDate = S.date;
  }
  S.store.dates = S.dates; S.store.reading = S.reading; S.store.readingDirty = S.readingDirty;
  try { localStorage.setItem(scopeKey(), JSON.stringify(S.store)); S.storageError = false; return true; }
  catch (e) { S.storageError = true; toast('本机存储失败：刷新可能丢失改动，请先联网保存或释放浏览器空间', 6000); return false; }
}
function preserveDraft() {
  if (persistLocal() && (S.dirty || S.readingDirty)) toast('未同步改动已保存在本机，切换或刷新不会丢失；决策仍待明确确认', 5000);
}

/* ---------------------------------------------------------------- 空壳版本：无凭据检查，只能显式刷新；不触碰业务同步 */
const U = { available: '', checking: null, registering: null, registration: null, updating: null, refreshing: false, swProblem: '' };
function unsafeHttp() {
  return location.protocol === 'http:' && !['localhost', '127.0.0.1', '[::1]', '::1'].includes(location.hostname);
}
function canonicalShellURL() {
  if (CURRENT_VERSION === 'dev' || !window.history?.replaceState) return;
  const url = new URL(location.href);
  if (url.searchParams.get('spider_version') !== CURRENT_VERSION) return;
  url.searchParams.delete('spider_version');
  window.history.replaceState(null, '', url.href); // 完成新版加载后恢复离线可缓存 URL，保留其他参数和 hash。
}
function showHTTPSWarning() {
  S.token = ''; stopObserving(); $('#hdr').hidden = true; $('#notice').hidden = true;
  $('#main').innerHTML = '<div class="login"><h1>请使用 HTTPS</h1><div class="hint">当前 HTTP 连接不安全，已禁止填写或加载 PAT。请改用此站点的 HTTPS 地址；本机 localhost 调试和直接打开 file 文件仍可使用。</div></div>';
  renderBuildStatus();
}
function renderBuildStatus() {
  $('#build-version').textContent = '当前版本：' + (CURRENT_VERSION === 'dev' ? '开发版' : CURRENT_VERSION);
  $('#update-shell').hidden = !U.available;
  $('#update-shell').textContent = '刷新到新版 ' + U.available;
  const message = [U.available ? '发现新版 ' + U.available + '；仅点击「刷新到新版」才会更新页面，请先确认保存所有日期的草稿并同步阅读状态。' : '', U.swProblem].filter(Boolean).join(' ');
  $('#shell-message').textContent = message; $('#shell-notice').hidden = !message;
  $('#login-update-shell').hidden = !U.available || !$('#hdr').hidden;
}
async function checkRelease() {
  if (U.checking) return U.checking;
  if (location.protocol === 'file:' || unsafeHttp()) return;
  U.checking = (async () => {
    let timer;
    try {
      const abort = new AbortController(); timer = setTimeout(() => abort.abort(), 8000);
      // 独立于 apiGet/apiHeaders：业务 PAT 与发布 PAT 都不参与此相对静态 GET。
      const r = await fetch('release.json', { method: 'GET', cache: 'no-store', credentials: 'omit', mode: 'same-origin', redirect: 'error', signal: abort.signal });
      if (!r.ok) return;
      const release = await r.json();
      if (!validBuildVersion(release?.version)) return;
      U.available = release.version !== CURRENT_VERSION ? release.version : '';
      renderBuildStatus();
    } catch (e) { /* 离线 / 缺少发布清单静默，不影响阅读与登录。 */ }
    finally { clearTimeout(timer); }
  })();
  try { await U.checking; } finally { U.checking = null; }
}
function swFailure() {
  U.swProblem = '空壳更新检查失败；页面不会自动刷新，请联网后重试（浏览器也可能不支持离线空壳）。';
  renderBuildStatus();
}
async function shellTimeout(task, ms = 12000) {
  let timer;
  try { return await Promise.race([task, new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('空壳更新超时，请联网后重试')), ms); })]); }
  finally { clearTimeout(timer); }
}
async function ensureShellWorker(update = false) {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:' || unsafeHttp()) return null;
  try {
    if (!U.registering) U.registering = navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
    const reg = await shellTimeout(U.registering);
    if (U.registration !== reg) {
      U.registration = reg;
      reg.addEventListener('updatefound', () => {
        const worker = reg.installing;
        if (worker) worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' || worker.state === 'activated') {
            U.swProblem = '空壳更新已就绪；不会自动刷新，请检查新版后手动更新。';
            renderBuildStatus(); void checkRelease();
          }
        });
      });
    }
    if (update) {
      if (!U.updating) U.updating = reg.update();

  }
}
async function switchView(view) {
  if (S.busy || S.loading) return toast('正在加载或保存，请稍候，或暂停加载');
  rememberPosition(); persistLocal(); S.filters[S.view] = S.readFilter; S.view = view; S.openId = ''; S.sheetId = '';
  S.readFilter = S.filters[view] || 'all'; $('#read-filter').value = S.readFilter; S.heldRead.clear();
  const position = S.positions[positionKey()];
  if (view !== 'favorites' && position?.date) {
    S.date = position.date; S.loadedDates = position.dates.slice();
    const day = S.store.days[S.date]; S.feed = day?.feed; S.keep = parsePicks(day?.picks); S.pending = Object.assign({}, day?.pending);
  } else if (view !== 'favorites') S.loadedDates = [S.date];
  else S.loadedDates = Object.keys(S.store.days).filter(date => S.store.days[date].feed).sort().reverse();
  S.loadError = ''; S.failedDate = ''; S.loadPaused = false; S.scanEmpty = 0;
  reconcilePending(); fillDates(); render(); restorePosition(); await loadMore(true);
}

/* ---------------------------------------------------------------- 保存全部：只确认已有决策草稿，阅读 / 收藏不产生确认 */
async function saveReadingState() {
  let written = null;
  await putWithRetry('data/state/reading_state.json', remote => {
    const latest = remote ? JSON.parse(remote) : emptyReading();
    written = mergeReading(latest, S.reading);
    S.reading = mergeReading(written, emptyReading()); // 独立快照：PUT 期间新已读仍必须待同步。
    reconcilePending(); persistLocal(); // 即使后续 PUT 失败，发现的远端销毁也不能丢。
    return JSON.stringify(written, null, 2) + '\n';
  }, 'chore(reading): 手机阅读状态字段合并');
  const current = mergeReading(written, S.reading);
  S.readingDirty = !sameReading(current, written); S.reading = current;
  reconcilePending(); persistLocal();
}
async function save() {
  if (S.busy || S.loading) return;
  persistLocal(); const dates = draftDates();
  if (!S.readingDirty && !dates.length) return toast('没有待保存改动；未操作日期不会自动确认');
  const message = dates.length ? `同步全部阅读状态，并确认以下 ${dates.length} 天的待保存决策：\n${dates.join('、')}\n未操作日期不会确认；不会立即清洗或归档。` : '同步全部阅读 / 收藏状态；没有待保存决策，不会确认任何日期。';
  if (!confirm(message)) return;
  S.busy = true; updateStatus(); moreObserver?.disconnect();
  const saved = [], failed = [];
  let readingSaved = false;
  try {
    await saveReadingState(); readingSaved = true; // 先合并远端墓碑，再逐日构建 picks。
    for (const date of dates) {
      const day = S.store.days[date];
      const pending = Object.assign({}, day.pending);
      try {
        if (!day.feed) throw new Error('缺少该日正文，请先加载该日期再保存');
        let text = '';
        await putWithRetry(`daily/${date}/picks.md`, remote => {
          text = buildPicks(date, day.feed.total || day.feed.people.reduce((n, p) => n + p.items.length, 0), remote, { feed: day.feed, pending });
          return text;
        }, `chore(picks): ${date} 手机端明确确认`);
        day.picks = text;
        for (const [id, value] of Object.entries(pending)) if (day.pending[id] === value) delete day.pending[id];
        if (date === S.date) { S.keep = parsePicks(text); S.pending = Object.assign({}, day.pending); }
        saved.push(date); persistLocal();
      } catch (e) { failed.push(`${date}：${e.message}`); }
    }
    S.offline = failed.length > 0;
    reconcilePending(); persistLocal();
    toast(failed.length ? `阅读状态已同步；决策成功 ${saved.length} 天，失败 ${failed.length} 天：${failed.join('；')}。失败草稿已保留，可重试。` : `阅读状态已同步${saved.length ? `；${saved.length} 天决策已确认保存` : '；没有确认任何日期'}${S.readingDirty ? '；保存期间的新已读仍待同步' : ''}`, 6500);
  } catch (e) {
    persistLocal(); toast(`${readingSaved ? '阅读状态已同步；' : '阅读状态同步失败，未确认任何决策；'}改动仍在本机：${e.message}`, 6500);
  } finally { S.busy = false; render(); }
}
async function deliver() {
  if (S.busy || S.loading || !S.feed) return;
  if (S.dirty) return toast('先点击顶部「保存」确认决策，再投递');
  if (!confirm(`仅投递 ${S.date} 的已确认干货到清洗队列？不会投递其他已加载日期；桌面仍受影子模式保护，投递不等于完成归档。`)) return;
  S.busy = true; updateStatus();
  try {
    await saveReadingState();
    const text = fileText(await apiGet(`daily/${S.date}/picks.md`), `daily/${S.date}/picks.md`) || '';
    S.store.days[S.date].picks = text; S.keep = parsePicks(text); reconcilePending(); persistLocal();
    if (S.dirty || !isConfirmed(text)) throw new Error('最新 picks 尚未确认或与桶状态不一致，请先确认并保存决策');
    const selected = allItems().filter(it => bucketOf(it) === 'good' && S.keep.get(it.id) === true);
    let added = 0;
    await putWithRetry('data/state/clean_queue.json', remote => {
      const list = remote ? JSON.parse(remote) : [];
      if (!Array.isArray(list)) throw new Error('清洗队列格式不正确，未覆盖远端');
      const seen = new Set(list.map(x => x.id)); added = 0;
      for (const it of selected) {
        if (readingItem(it.id).bucket === 'destroyed' || seen.has(it.id)) continue;
        list.push({ id: it.id, date: S.date, requested_at: new Date().toISOString(), status: 'pending' });
        seen.add(it.id); added++;
      }
      return JSON.stringify(list, null, 2) + '\n';
    }, `chore(clean): ${S.date} 手机投递清洗意图`);
    toast(added ? `已投递 ${added} 条，等待桌面处理` : '没有新的可投递条目'); S.offline = false;
  } catch (e) { toast(e.message || String(e), 5000); }
  finally { S.busy = false; render(); }
}
async function fullscreen() {
  try {
    if (document.fullscreenElement) { await document.exitFullscreen(); return; }
    if (!document.documentElement.requestFullscreen) throw new Error('unsupported');
    await document.documentElement.requestFullscreen();
  } catch (e) { toast('浏览器不支持或拒绝全屏：请在浏览器菜单中「添加到主屏幕」，再从主屏幕打开', 6500); }
}

/* ---------------------------------------------------------------- 令牌存储（可选 PIN 加密） */
async function deriveKey(pin, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function saveAuth(token, pin) {
  if (unsafeHttp()) throw new Error('请使用 HTTPS，HTTP 下禁止保存 PAT');
  if (!pin) { localStorage.setItem(LS.auth, JSON.stringify({ mode: 'plain', token })); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pin, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(token));
  const raw64 = bytes => btoa(String.fromCharCode(...bytes));
  localStorage.setItem(LS.auth, JSON.stringify({ mode: 'pin', encoding: 'raw', salt: raw64(salt), iv: raw64(iv), ct: raw64(new Uint8Array(ct)) }));
}
async function loadAuthWithPin(pin) {
  if (unsafeHttp()) throw new Error('请使用 HTTPS，HTTP 下禁止加载 PAT');
  const a = storedAuth(); if (!a || a.mode !== 'pin') throw new Error('没有加密的令牌');
  // 兼容旧版经 UTF-8 再 base64 的二进制凭据，新版直接编码原始字节。
  const u8 = s => Uint8Array.from(a.encoding === 'raw' ? atob(s) : b64dec(s), c => c.charCodeAt(0));
  const key = await deriveKey(pin, u8(a.salt));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(a.iv) }, key, u8(a.ct));
  return new TextDecoder().decode(pt);
}
function storedAuth() { if (unsafeHttp()) return null; try { return JSON.parse(localStorage.getItem(LS.auth) || 'null'); } catch (e) { return null; } }
function showLogin(msg) {
  if (unsafeHttp()) return showHTTPSWarning();
  stopObserving(); $('#hdr').hidden = true; $('#notice').hidden = true; renderBuildStatus();
  $('#main').innerHTML = `<div class="login">
    <h1>干货阅读</h1><div class="hint">用你的令牌读取私有仓，凭据只存在本机。</div>
    ${msg ? `<div class="hint">${esc(msg)}</div>` : ''}
    <label for="f-provider">数据源</label><select id="f-provider" style="width:100%">${Object.entries(PROVIDERS).map(([k, v]) => `<option value="${k}"${S.cfg.provider === k ? ' selected' : ''}>${esc(v.label)}</option>`).join('')}</select>
    <div class="hint" id="f-hint">${esc(provider().hint)}</div>
    <label for="f-repo">仓库（owner/repo）</label><input id="f-repo" value="${esc(S.cfg.owner + '/' + S.cfg.repo)}" autocapitalize="off" autocorrect="off">
    <label for="f-branch">分支（留空用默认分支）</label><input id="f-branch" value="${esc(S.cfg.branch)}" autocapitalize="off" autocorrect="off">
    <label for="f-token">令牌</label><input id="f-token" type="password" placeholder="粘贴令牌" autocapitalize="off" autocorrect="off">
    <label for="f-pin">PIN（可选：加密保存令牌）</label><input id="f-pin" type="password" inputmode="numeric" placeholder="留空 = 明文保存在本机">
    <button class="primary" id="f-go" style="width:100%;margin-top:22px">进入</button>
    <div class="hint" style="margin-top:18px">PIN 只加密凭据，不加密本机正文与阅读缓存。Gitee 令牌泄露影响整个账号；GitHub fine-grained 仅影响授权仓。</div>
  </div>`;
  $('#f-provider').onchange = () => { const pv = PROVIDERS[$('#f-provider').value]; $('#f-hint').textContent = pv.hint; $('#f-repo').value = pv.repo; };
  $('#f-go').onclick = async () => {
    const [o, r, extra] = ($('#f-repo').value || '').trim().split('/');
    if (!o || !r || extra) return toast('仓库格式：owner/repo');
    const token = $('#f-token').value.trim(); if (!token) return toast('先填令牌');
    const cfg = { owner: o.trim(), repo: r.trim(), branch: $('#f-branch').value.trim(), provider: $('#f-provider').value };
    try {
      await saveAuth(token, $('#f-pin').value.trim());
      S.cfg = cfg; S.token = token; localStorage.setItem(LS.cfg, JSON.stringify(S.cfg)); boot();
    } catch (e) { toast('凭据保存失败：' + e.message, 5000); }
  };
}
async function promptPin() {
  if (unsafeHttp()) return showHTTPSWarning();
  $('#hdr').hidden = true; renderBuildStatus();
  $('#main').innerHTML = `<div class="login"><h1>输入 PIN</h1><div class="hint">令牌已加密保存在本机。</div>
    <label for="f-pin">PIN</label><input id="f-pin" type="password" inputmode="numeric" autofocus>
    <button class="primary" id="f-go" style="width:100%;margin-top:22px">解锁</button>
    <div class="hint" style="margin-top:18px"><a href="#" id="f-reset">忘记 PIN / 换令牌</a></div></div>`;
  const go = async () => {
    try { S.token = await loadAuthWithPin($('#f-pin').value.trim()); }
    catch (e) { return toast('PIN 不对'); }
    boot();
  };
  $('#f-go').onclick = go;
  $('#f-pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#f-reset').onclick = e => { e.preventDefault(); localStorage.removeItem(LS.auth); location.reload(); };
}
async function boot() {
  if (unsafeHttp()) return showHTTPSWarning();
  restoreLocal(); $('#hdr').hidden = false; renderBuildStatus();
  try {
    await loadDates();
    if (!S.dates.length) { updateStatus(); $('#main').innerHTML = '<div class="empty">还没有 daily/ 或本机离线缓存</div>'; return; }
    await loadDay(S.dates[0]); // 默认从最新日期开始；历史草稿仍独立保留。
  } catch (e) { showLogin('未能读取仓库：' + e.message + '。本机缓存没有删除。'); }
}

/* ---------------------------------------------------------------- 事件 / 启动 */
$('#dates').onchange = e => {
  if (S.busy || S.loading) { e.target.value = S.date; return toast('正在处理，请稍候或暂停加载'); }
  rememberPosition(); preserveDraft(); S.positions[positionKey()] = null; closeMenu();
  if (window.scrollTo) window.scrollTo(0, 0);
  void loadDay(e.target.value);
};
$('#refresh').onclick = async () => {
  closeMenu();
  void checkRelease(); void ensureShellWorker(true);
  if (S.busy || S.loading) return toast('正在处理，请稍候或暂停加载');
  preserveDraft();
  try { await loadDates(); } catch (e) { return toast('日期列表刷新失败：' + e.message, 5000); }
  if (S.view === 'favorites') {
    S.busy = true;
    try {
      const text = fileText(await apiGet('data/state/reading_state.json'), 'reading_state.json');
      adoptReading(text == null ? emptyReading() : JSON.parse(text));
      // 刷新收藏会重新查找缓存以外的日期；保留离线正文及作者位置。
    } catch (e) { S.offline = true; toast('刷新失败，保留本机收藏：' + e.message, 5000); }
    finally { S.busy = false; }
    await switchView('favorites');
  } else await loadDay(S.dates[0] || S.date);
};
$('#update-shell').onclick = () => { closeMenu(); return refreshToNewVersion(); };
$('#login-update-shell').onclick = refreshToNewVersion;
$('#save').onclick = save;
$('#queue').onclick = () => { closeMenu(); return deliver(); };
$('#fullscreen').onclick = () => { closeMenu(); return fullscreen(); }; // 必须由点击触发，绝不在开页时请求。
for (const b of document.querySelectorAll('[data-view]')) b.onclick = () => { void switchView(b.dataset.view); };
$('#read-filter').onchange = e => {
  if (S.busy || S.loading) { e.target.value = S.readFilter; return toast('正在处理，请稍候或暂停加载'); }
  S.readFilter = e.target.value; S.heldRead.clear(); S.loadPaused = false; S.scanEmpty = 0;
  closeMenu(); render(); void loadMore(true);
};
$('#main').addEventListener('click', e => {
  const control = e.target.closest('button'); if (!control) return;
  if (control.dataset.loadPause !== undefined) { S.cancelLoad = true; return; }
  if (control.dataset.loadMore !== undefined) { S.loadPaused = false; S.scanEmpty = 0; void loadMore(true); return; }
  // 详情页打开 / 返回、分享与「更多」弹窗只是导航或只读动作，加载中也允许，避免自动加载时点不动。
  if (control.dataset.open !== undefined) { openDetail(control.dataset.open); return; }
  if (control.dataset.backDetail !== undefined) { closeDetail(); return; }
  const b = e.target.closest('button[data-action]');
  const id = b ? (b.dataset.id || b.closest('.card')?.dataset.id || S.openId || '') : '';
  if (b && b.dataset.action === 'share') { const it = timelineItems().find(it => it.id === id); if (it) void sharePost(it); return; }
  if (b && b.dataset.action === 'more') { openSheet(id); return; }
  if (S.busy || S.loading) return toast('正在处理，请稍候或暂停加载');
  if (control.dataset.author !== undefined) {
    rememberPosition(); S.favoriteAuthor = control.dataset.author; render(); restorePosition(); return;
  }
  if (control.dataset.backAuthors !== undefined) {
    rememberPosition(); S.favoriteAuthor = ''; render(); restorePosition(); return;
  }
  if (!b) return;
  applyAction(b.dataset.action, id);
});
// 更多弹窗：点选项或遮罩 / 取消关闭；水贴 / 销毁走与卡片相同的动作。
$('#sheet').addEventListener('click', e => {
  const t = e.target;
  if (t && t.id === 'sheet-mask') { closeSheet(); return; }
  const b = t && t.closest ? t.closest('button') : null;
  if (!b) return;
  if (b.dataset.sheetClose !== undefined) { closeSheet(); return; }
  const action = b.dataset.sheetAction; if (!action) return;
  const id = S.sheetId; closeSheet();
  if (action === 'open') { const it = timelineItems().find(it => it.id === id); if (it) openExternal(it.url); return; }
  applyAction(action, id);
});
function applyAction(action, id) {
  if (S.busy || S.loading) return toast('正在处理，请稍候或暂停加载');
  const it = timelineItems().find(it => it.id === id); if (!it || bucketOf(it) === 'destroyed') return;
  if (action === 'favorite' && bucketOf(it) === 'good') {
    S.undo = { id, field: 'favorite', value: !!readingItem(id).favorite };
    changeReading(id, 'favorite', !readingItem(id).favorite);
  } else if (action === 'bucket') {
    S.undo = { id, field: 'bucket', value: bucketOf(it) };
    changeReading(id, 'bucket', bucketOf(it) === 'water' ? 'good' : 'water');
  } else if (action === 'destroy') {
    if (!confirm('永久销毁这条帖子？同步后在所有日期和收藏中永不展示，不能恢复；原始业务文件不会删除。')) return;
    S.undo = null; changeReading(id, 'bucket', 'destroyed');
  } else return;
  render();
  if (['favorite', 'bucket'].includes(action) && S.undo) {
    toast(action === 'favorite' ? (readingItem(id).favorite ? '已收藏' : '已取消收藏') : (bucketOf(it) === 'water' ? '已移到水贴' : '已捞回干货'), 5000);
    const button = document.createElement?.('button');
    if (button) {
      button.textContent = '撤销';
      const undo = S.undo;
      button.onclick = () => {
        if (S.busy || S.loading || readingItem(undo.id).bucket === 'destroyed') return toast('正在处理或帖子已销毁，无法撤销');
        changeReading(undo.id, undo.field, undo.value); S.undo = null; render(); toast('已撤销，仍待保存');
      };
      $('#toast').appendChild(button);
    }
  } else if (action === 'destroy') toast('已永久隐藏；点击顶部保存后同步到其他设备');
}
window.addEventListener('pagehide', persistLocal);
// 桌面按 Esc 收起菜单 / 更多弹窗；手机端靠点遮罩或取消。
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); closeSheet(); } });
// 菜单是原生 <details>，点菜单以外的地方收起，避免遮住正文。
document.addEventListener('click', e => {
  const more = $('#more');
  if (!more || !more.open || (e.target.closest && e.target.closest('.more'))) return;
  more.open = false;
});
window.addEventListener('beforeunload', e => {
  persistLocal();
  if (S.dirty || draftDates().length || S.readingDirty || S.storageError) { e.preventDefault(); e.returnValue = ''; }
});
renderBuildStatus();
(async function start() {
  if (unsafeHttp()) return showHTTPSWarning(); // 在任何配置 / 凭据读取之前拦截不安全启动。
  canonicalShellURL();
  void checkRelease(); void ensureShellWorker();
  try { Object.assign(S.cfg, JSON.parse(localStorage.getItem(LS.cfg) || '{}')); } catch (e) { }
  // 登录 / PIN 解锁前也能刷新空壳，先恢复当前仓的草稿，避免空 store 覆盖已有草稿。
  restoreLocal(); S.dates = S.store.dates || [];
  const a = storedAuth(); if (!a) return showLogin();
  if (a.mode === 'pin') return promptPin();
  S.token = a.token; boot();
})();
</script>
